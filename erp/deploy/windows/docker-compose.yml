name: neksa-erp

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    image: neksa-erp:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
    ports:
      - "${APP_PORT:-8000}:8080"
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: neksa-erp:latest
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app: { condition: service_started }

  scheduler:
    image: neksa-erp:latest
    restart: unless-stopped
    env_file: [.env]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      app: { condition: service_started }

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-neksa_erp}
      POSTGRES_USER: ${DB_USERNAME:-neksa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-neksa_erp}", "-U", "${DB_USERNAME:-neksa}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  pgsql-data:
  redis-data:
  app-storage:
